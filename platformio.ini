; LoRa HAB link-budget test — Heltec WiFi LoRa 32 V3
; Flash:  pio run -e payload -t upload
;         pio run -e ground  -t upload
; Monitor: pio device monitor -e ground  (or payload)

[platformio]
default_envs = payload, ground

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_flags =
	-I include
	-D CORE_DEBUG_LEVEL=0
lib_deps =
	jgromes/RadioLib @ ^7.1.2
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit MPU6050 @ ^2.2.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	mikalhart/TinyGPSPlus @ ^1.0.3
; Clone MPU6050 modules often return WHO_AM_I=0x98; Adafruit only accepts 0x68.
extra_scripts = pre:patch_mpu6050.py

[env:payload]
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_flags =
	${env.build_flags}
	-DHAB_ROLE_PAYLOAD=1
build_src_filter =
	+<payload/>

[env:ground]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
	${env.build_flags}
	-DHAB_ROLE_GROUND=1
build_src_filter =
	+<ground/>
